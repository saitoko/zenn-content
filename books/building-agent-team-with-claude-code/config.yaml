title: "Claude Codeで作る1人エージェントチーム"
summary: |
  TypeScriptやPythonを書きながらClaude Codeに聞いて、答えをもらって、また聞く。
  それでも十分便利です。
  けれど1人で複数のサブエージェントに役割を持たせ、実装フローの中で働かせると、
  景色が変わります。

  本書は、自分の実装フローにサブエージェントを組み込むまでを扱います。
  組織導入やチーム活用の話はしません。
  「1人」のスケールに絞ります。

  ◆ 進め方はシンプルです
  最初に全体を設計しない。まずwriter + reviewerの2体を動かし、詰まりを感じたら1体足す。
  この積み上げ方を軸に、CLAUDE.md・カスタムコマンド・Hooks・Agent Skills・Plan modeを
  「1人開発のどこに置くか」という観点で体系化します。

  ◆ 失敗を隠しません
  著者は自身のエージェントチーム運用で、実際に事故を起こしてきました。
  「レビュアーに書き換え権限を渡したら、勝手に実装まで直された」
  「AIが存在しないライブラリのAPIを書いた」——
  こうした失敗から導いた判断基準（どの役割に何の権限を渡すか、
  いつコンテキストをリセットするか）を実用形で提示します。

  ◆ 構成（序章＋第1〜15章＋エピローグ）
  ・第1部（第1〜3章）: Claude Codeの基礎を1人で固める
  ・第2部（第4〜6章）: サブエージェントという発想
  ・第3部（第7〜9章）: 動かしてみる——最小2体構成
  ・第4部（第10〜12章）: 最新機能を1人で使い倒す
  ・第5部（第13〜15章）: 1人運用のリアル

  ◆ こんな方におすすめ
  ・Claude Codeを「賢いチャットボット」として使っていて、次の一手を探しているエンジニア
  ・副業・個人開発の1人フローにサブエージェントを組み込みたい方
  ・「組織導入の話ばかりで、自分のスケールに合わない」と感じてきた方

  序章は無料公開しています。
  本書の実践には、AnthropicのProまたはMaxプラン（月額$20〜）の契約が必要です。
  著者: saitoko
