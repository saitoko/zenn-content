title: "コードを書けない私がClaude Codeで「AIチーム」と書き続けるまで"
summary: |
  AIに書かせた原稿を読み返して、「これは自分の文章じゃない」と感じたことはありますか。
  チームが回り始めた先で、私はその感覚に突き当たりました。
  本書は、「書き続けられる人」になるまでの泥臭い記録です。

  本書を読み終えると、こんな変化が手元に残ります。
  ・日常の作業の中にネタを自動収集する「仕込みの設計」が動き出す
  ・AIが書いた原稿を「自分の文章かどうか」を問う最終関門を作れる
  ・はてな・Zenn・Qiitaへのクロスポストと告知を自動化し、届ける設計が回る
  ・GA4の数字をネタ帳に返すフィードバックループで、ループが外部刺激なしに自走する
  ・Playbookが自然と積み重なり、90近くに育った時点で自分の判断の輪郭が外に出る

  ◆ 本書で扱う4つのテーマ
  ・第1部「仕込む」：アンテナモデルへの転換、ネタ帳の物理設計、クイックキャプチャ
  ・第2部「書く」：著者ペルソナレビュー、対話アーカイブ、別ジャンル並走
  ・第3部「届ける」：流通設計、SEO×収益化、クロスポストの自動化
  ・第4部「回収する」：GA4フィードバックループ、Zenn Book改訂、事故と組織学習

  ◆ こんな方におすすめ
  ・AIを使ってコンテンツを出し続けたいが、息切れしている方
  ・AIが書いた文章に「自分らしさが薄い」と感じている方
  ・Claude Codeで複数エージェントを運用しながら、書き手としての個性を守りたい方
  ・[Vol.2](https://zenn.dev/tottoko_hamu/books/operating-ai-team-without-code)を読んでAIチームを回し始めたが、「何を書き続ければいいか」に詰まっている方

  本書はVol.2を読んでいない方でも読み進められるよう設計されています。
  序章は無料公開しています。中身を確認してから購入をご判断ください。
  本書を実践するには、Anthropicの有料プラン（Pro以上、月額$20〜）の契約が必要です。実際の制作規模ではMaxプラン相当が現実的です。
  前作: [Vol.2「AIチームを回すまで」](https://zenn.dev/tottoko_hamu/books/operating-ai-team-without-code)
  著者: saitoko / ブログ「コードを書かないSE日誌」(blog.saitoko.net)を運営。
